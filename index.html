<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Roblox Outfit Viewer</title>
  <meta name="description" content="Roblox R15 3D outfit viewer for WebView integration." />
  <link rel="stylesheet" href="public/css/style.css" />
  <link rel="icon" type="image/x-icon" href="public/assets/icon.ico" />
  <link rel="apple-touch-icon" type="image/png" href="public/assets/icon.png" />
  <style>
    /* Viewer-only overrides */
    body, html { margin: 0; padding: 0; overflow: hidden; background: #0b0e11; }
    #viewer { width: 100vw; height: 100vh; position: relative; }
    #canvasMount { width: 100%; height: 100%; }
    .workspace-controls {
      position: absolute;
      bottom: 24px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }
    #sidebar {
      position: absolute;
      top: 0; right: 0;
      height: 100%;
      z-index: 20;
    }
  </style>
</head>

<body>
  <div id="viewer">
    <div id="canvasMount"></div>

    <div class="workspace-controls">
      <button id="resetView" class="back-btn" title="Reset View">🔄</button>
      <button id="screenshot" class="back-btn" title="Save Screenshot">📸</button>
    </div>


  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "./public/js/lib/three.module.js",
      "three/examples/jsm/controls/OrbitControls.js": "./public/js/lib/OrbitControls.js",
      "three/examples/jsm/loaders/GLTFLoader.js": "./public/js/lib/GLTFLoader.js"
    }
  }
  </script>
  <script type="module" src="public/js/app.js"></script>
</body>

</html>
